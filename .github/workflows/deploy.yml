name: Build Flask Docker Image

on:
  push:
    branches: [ clean-main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check passwd
      run: echo ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: guigo13
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
